    - generic [ref=f19e342]:
      - paragraph [ref=f19e348]: Strategy Most first versions try to do too much. We help you find the idea inside the idea, the version that ships fast, teaches you something, and gives you a foundation to grow from.
      - paragraph [ref=f19e354]: Design We design software that works, then make it beautiful. Fast cycles, constant testing, no pixel-pushing for its own sake. The goal is software people understand the moment they open it.
      - paragraph [ref=f19e360]: Branding Your product needs a face before it needs a marketing team. We create identities that are clear, simple, and built to last longer than your first pivot.
      - paragraph [ref=f19e366]: Development From Figma to Xcode, same hands. We implement our own designs in native Swift, no separate dev team reinterpreting your product. The follow-through is the point.
      - paragraph [ref=f19e372]: "Websites Your site should feel like your product. We design and build marketing sites, landing pages, and docs that match your software: fast, clear, and conversion-ready."
      - paragraph [ref=f19e378]:
        - text: AI & Machine Learning We build AI that actually helps. Our app
        - link "Whistle" [ref=f19e379] [cursor=pointer]:
          - /url: ./whistle
        - text: "is an AI fitness agent, it plans, adapts, and coaches. We bring the same approach to client projects: ML that solves real problems, not demos."
