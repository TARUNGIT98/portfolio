      - heading "What powers our apps" [level=3] [ref=f19e387]
      - paragraph [ref=f19e389]: We'd rather own our stack than depend on someone else's. When something matters, we build it ourselves. Full control, no surprises, no waiting on someone else's roadmap.
    - generic [ref=f19e390]:
      - paragraph [ref=f19e397]: IntelligenceKit The agent layer behind our AI features. Orchestrates models, handles memory, powers interactions from subtle prompts to complex autonomous workflows. Built for real products, not demos.
      - paragraph [ref=f19e404]: FeatherKit Our design system. Components, patterns, and primitives that make apps feel consistent from day one. Born from our own products, refined with every release.
      - paragraph [ref=f19e411]: RevenueKit Subscriptions, paywalls, referrals. We built this so we'd never have to think about StoreKit edge cases again.
      - paragraph [ref=f19e418]: InsightsKit Anonymous, privacy-first tracking that tells us what's working, without harvesting user data. A/B tests included.
